# Builds the PR preview image for every push to a branch other than main, pushes
# it to Cachix, and sets the commit status `preview` that lain's controller reads
# (see nix/previews-module.nix). A branch without an open PR gets an image and a
# status but no preview: the controller only runs open PRs.
#
# `push`, not `pull_request`: the `cachix` environment matches its branch rules
# against GITHUB_REF, which for pull_request runs is refs/pull/<n>/merge. On a
# push it is refs/heads/<branch>, which the environment's rules allow for
# `push-*` (what `jj git push -c` creates), any name without a slash, and the
# usual `feat/*`, `fix/*`, ... prefixes. Renovate's branches (renovate/...) are
# left out twice — by `branches-ignore` here and by the environment, whose rules
# match no `renovate/` name — so dependency-update code never runs with the
# Cachix token. Forks cannot push here at all. Renovate's previews are built
# without the token by ci.yml and pushed by preview-renovate.yml. Main and
# release-please's branch have nothing to preview.
name: preview

on:
  push:
    branches-ignore:
      - main
      - "renovate/**"
      - "release-please--**"

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-26.04
    # The job's environment is what GitHub lists under the PR as a deployment;
    # its url turns that entry into a "View deployment" link to the preview.
    environment:
      name: cachix
      url: ${{ steps.status.outputs.url }}
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: werwolf-clj
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Pushed here rather than left to cachix-action's post step, which runs
      # after the status below: lain must never see an image it cannot fetch.
      - name: Build and push
        id: build
        run: |
          path=$(nix build -L .#preview-image --print-out-paths)
          cachix push werwolf-clj "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Set the preview status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: nix:0${{ steps.build.outputs.path }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # --head matches the branch name alone, and a fork's PR may use the
          # same one (push-<change id> names are public). The link would then
          # lead to the fork PR's host, where the controller, which skips
          # cross-repository PRs, runs no preview.
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number,isCrossRepository \
                 --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          args=(-f state=success -f context=preview -f "description=$IMAGE")
          if [ -n "$pr" ]; then
            url="https://pr-$pr.werwolf-chrz.duckdns.org"
            args+=(-f "target_url=$url")
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" "${args[@]}" --silent
          echo "preview status set on $GITHUB_SHA${pr:+ (PR #$pr)}: $IMAGE"

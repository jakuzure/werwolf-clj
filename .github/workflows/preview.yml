# Builds the PR preview image for every push to a push-* branch (the branches
# `jj git push -c` creates), pushes it to Cachix, and sets the commit status
# `preview` that lain's controller reads (see nix/previews-module.nix).
#
# `push`, not `pull_request`: the `cachix` environment matches its branch rules
# against GITHUB_REF, which for pull_request runs is refs/pull/<n>/merge. On a
# push it is refs/heads/push-…, which the rule `push-*` allows. Renovate's
# branches (renovate/*) never match, so dependency-update code never runs with
# the Cachix token, and forks cannot push here at all. Renovate's previews are
# built without the token by ci.yml and pushed by preview-renovate.yml.
name: preview

on:
  push:
    branches: ["push-*"]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-26.04
    environment: cachix
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: werwolf-clj
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Pushed here rather than left to cachix-action's post step, which runs
      # after the status below: lain must never see an image it cannot fetch.
      - name: Build and push
        id: build
        run: |
          path=$(nix build -L .#preview-image --print-out-paths)
          cachix push werwolf-clj "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Set the preview status
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: nix:0${{ steps.build.outputs.path }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq '.[0].number // empty')
          args=(-f state=success -f context=preview -f "description=$IMAGE")
          if [ -n "$pr" ]; then
            args+=(-f "target_url=https://pr-$pr.werwolf-chrz.duckdns.org")
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" "${args[@]}" --silent
          echo "preview status set on $GITHUB_SHA${pr:+ (PR #$pr)}: $IMAGE"

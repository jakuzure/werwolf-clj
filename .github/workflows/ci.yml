# Builds the nix package (which is also the deploy artifact for lain) and runs
# the JVM and ClojureScript suites, plus the browser suite against a real LiveKit.
#
# The suites run on pull requests only. A push to main is a PR that has just
# merged, and its code already passed them there, so main only builds: the
# build is what lain deploys, through Cachix. Main also keeps the dependency
# caches warm, since it is the one branch every PR can read caches from.
# The browser suite is its own job: it needs a browser download and an SFU and is
# an order of magnitude slower, and running beside `build` rather than inside it
# keeps the nix build, which is what lain deploys, as fast as it ever was.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR (a fix, a re-push of a stack, GitHub rebasing one after a
# merge) cancels the run it replaces: nobody reads the outdated one's result.
# Never on main, where every commit's build is pushed to Cachix and may be the
# one lain is pinned to.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    # CACHIX_AUTH_TOKEN is a secret of the `cachix` environment, which only main
    # may use; everywhere else this is empty, i.e. no environment and no token,
    # so no PR or other branch can read it, not even one that edits this
    # workflow. Forks get no secrets anyway.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'cachix' || '' }}
    permissions:
      # Only to push a regenerated deps-lock.json back to a Renovate branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On a Renovate PR, check out the branch itself rather than the merge
          # commit, so a regenerated lockfile can be committed back to it. Empty
          # means the default, which also keeps PRs from forks working.
          ref: ${{ startsWith(github.head_ref, 'renovate/') && github.head_ref || '' }}

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Pushes main's build to Cachix, which lain substitutes werwolf from
      # instead of compiling it. Elsewhere there is no token, so it only reads.
      #
      # The one cache this job uses. It also had magic-nix-cache, which spent
      # minutes after every PR build uploading each path the build made to the
      # GitHub cache one by one — mostly the npm tarballs of a frontend the
      # preview had not pushed to Cachix yet. A PR's GitHub cache is visible to
      # that PR alone, so nothing else could ever read them; Cachix already
      # holds what main and every preview build.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: werwolf-clj
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Renovate bumps deps.edn but cannot run nix on Mend's side, so the clj-nix
      # lockfile would go stale and the offline build would fail on a missing
      # artifact. Regenerate it here. renovate.json lists this bot under
      # gitIgnoredAuthors, so Renovate keeps managing the branch afterwards.
      #
      # Deliberately Renovate-only: a person who changes deps.edn should see the
      # build fail and regenerate it themselves, as flake.nix documents.
      - name: Regenerate deps-lock.json on Renovate branches
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'renovate/')
        run: |
          nix run github:jlesquembre/clj-nix#deps-lock -- --alias-exclude dev
          if git diff --quiet -- deps-lock.json; then
            echo "deps-lock.json already current"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deps): regenerate deps-lock.json" -- deps-lock.json
            git push
          fi

      - name: Build
        run: nix build .#werwolf -L

      # Renovate's PRs get a preview too, but not from preview.yml: this job runs
      # the updated dependencies' build and so must never hold the Cachix token.
      # It builds the image and hands over its closure, and preview-renovate.yml,
      # which runs nothing from it, pushes it and sets the status. Built here
      # because only this run sees the regenerated deps-lock.json: a push made
      # with the workflow token starts no workflow of its own.
      - name: Build the preview image on Renovate branches
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'renovate/')
        run: |
          path=$(nix build -L .#preview-image --print-out-paths)
          nix copy --to "file://$RUNNER_TEMP/preview?compression=zstd" "$path"
          echo "$path" > "$RUNNER_TEMP/preview/image"
          git rev-parse HEAD > "$RUNNER_TEMP/preview/sha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'renovate/')
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          retention-days: 1
          # the NARs are zstd already
          compression-level: 0

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # Not signed up for FlakeHub: without this every run logs a red
          # "Unable to authenticate to FlakeHub" error. The GitHub cache still works.
          use-flakehub: false
      # Maven jars for the Clojure CLI. Restored only: main's `deps` job is
      # what fills it, since a cache saved from a PR is visible to that PR
      # alone.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: m2-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: m2-

      - name: JVM suite
        run: nix shell nixpkgs#babashka nixpkgs#clojure nixpkgs#jdk21_headless -c bb test

      - name: Preview controller suite
        run: nix shell nixpkgs#babashka -c bb previews:test

  # A job of its own so it runs beside the JVM suite rather than after it. It
  # plays a quarter of the simulation's random games (see harness/volume):
  # Node is here to prove a seed plays the same game on both platforms, which
  # the pinned fingerprints check, and the JVM already plays them all.
  test-cljs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
      # Maven jars for the Clojure CLI. Restored only: main's `deps` job is
      # what fills it, since a cache saved from a PR is visible to that PR
      # alone.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: m2-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: m2-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: ClojureScript suite
        run: nix shell nixpkgs#babashka nixpkgs#clojure nixpkgs#jdk21_headless nixpkgs#nodejs_22 -c bb test:cljs

  browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # A service container rather than `docker run` in a step, so the image is
    # somewhere Renovate reads (its github-actions manager understands
    # `services:`) and moves with the compose files and livekit-client in the
    # "livekit" group. Pinned to deploy/docker-compose.yml's version: that is
    # what production runs, so that is what voice is tested against.
    services:
      livekit:
        image: livekit/livekit-server:v1.13.10
        env:
          # Services take no command line, so deploy/livekit.dev.yml's flags are
          # spelt as the config they stand for, in the variable livekit-server
          # reads it from:
          # - `development: true` is `--dev`, and with it LiveKit accepts the
          #   placeholder `devkey: secret` the browser suite mints tokens with,
          #   rather than complaining that the secret is too short;
          # - bind_addresses 0.0.0.0 because inside a container loopback is not
          #   where the published ports arrive;
          # - node_ip 127.0.0.1 for the same reason as in livekit.dev.yml: it is
          #   what LiveKit puts in its ICE candidates, and the browser runs on
          #   this host and reaches the container through the ports below.
          # One line of flow-style YAML (`>-` folds it), so nothing depends on
          # how the runner carries a multi-line value through `docker create`.
          LIVEKIT_CONFIG: >-
            {development: true,
            keys: {devkey: secret},
            port: 7880,
            bind_addresses: [0.0.0.0],
            rtc: {tcp_port: 7881, port_range_start: 7882, port_range_end: 7892, node_ip: 127.0.0.1}}
        ports:
          - 7880:7880
          - 7881:7881
          - 7882-7892:7882-7892/udp
    env:
      # A LiveKit was started for this job, so the voice tests FAIL when it is
      # unreachable instead of skipping, which would let a broken service pass
      # as a green run with no voice coverage at all. See liveKitUp in
      # test/browser/helpers.js.
      WERWOLF_REQUIRE_LIVEKIT: "1"
    defaults:
      run:
        # The same tools the test job takes from nixpkgs, for every step. The
        # browser itself is Playwright's own download, run against the runner's
        # libraries, which is why it is not in this list.
        shell: nix shell nixpkgs#babashka nixpkgs#clojure nixpkgs#jdk21_headless nixpkgs#nodejs_22 -c bash -eo pipefail {0}
    steps:
      # First, and in plain bash rather than the nix shell, so a broken service
      # fails the job in seconds with one clear line instead of minutes later as
      # a wall of red voice tests. 401 is LiveKit up and refusing an
      # unauthenticated request.
      - name: LiveKit is up
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 15 --retry-connrefused --retry-delay 2 \
                   http://localhost:7880/rtc/validate || true)
          echo "LiveKit answered $code"
          test "$code" = 401

      # The default shallow clone is enough for version.spec.js: it compares the
      # page against `git rev-parse HEAD`, which the build also read, and HEAD is
      # the one commit a depth-1 checkout is guaranteed to have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # Not signed up for FlakeHub: without this every run logs a red
          # "Unable to authenticate to FlakeHub" error. The GitHub cache still works.
          use-flakehub: false
      # Maven jars for the Clojure CLI. Restored only: main's `deps` job is
      # what fills it, since a cache saved from a PR is visible to that PR
      # alone.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: m2-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: m2-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      # `npm ci` rather than letting bb's npm-install task run `npm install`: the
      # lockfile is what gets tested, never a fresh resolution of it. Afterwards
      # node_modules is newer than package.json, so that task finds nothing to do.
      - name: Install node dependencies
        run: npm ci

      # Chromium only; it is the one project in playwright.config.js. --with-deps
      # apt-installs the system libraries it needs, which nix does not provide.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the release bundle and CSS first (the suite deliberately tests
      # the :advanced build) and lets Playwright start the server itself.
      - name: Browser suite
        run: bb test:browser

  # Fills the dependency caches the jobs above restore, on main only: a cache
  # saved by a PR run is visible to that PR alone, while main's are visible to
  # every PR. Each half is fetched only when its key is new, i.e. when deps.edn
  # or package-lock.json changed, so most pushes to main skip both.
  deps:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: nix shell nixpkgs#babashka nixpkgs#clojure nixpkgs#jdk21_headless nixpkgs#nodejs_22 -c bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - id: m2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: m2-${{ hashFiles('deps.edn', 'bb.edn') }}
          lookup-only: true
      # Every alias the suites start the CLI with: the JVM suite's, and
      # shadow-cljs's for the ClojureScript suite and the release build.
      - name: Fetch the Maven jars
        if: steps.m2.outputs.cache-hit != 'true'
        run: |
          clojure -P -M:test
          clojure -P -M:cljs:cljs-test
      - if: steps.m2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: m2-${{ hashFiles('deps.edn', 'bb.edn') }}

      - id: npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-${{ hashFiles('package-lock.json') }}
          lookup-only: true
      # The browser download only, not --with-deps: the system libraries are
      # apt packages, outside the cache, and the browser job installs them.
      - name: Fetch the npm packages and Chromium
        if: steps.npm.outputs.cache-hit != 'true'
        run: |
          npm ci
          npx playwright install chromium
      - if: steps.npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-${{ hashFiles('package-lock.json') }}

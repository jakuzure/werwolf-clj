# The PR previews end to end in a VM: k3s with nix-snapshotter, the
# controller, Caddy and the preview image (nix/previews-test.nix). Also what
# catches a nixpkgs update breaking nix images before lain does.
#
# Its own workflow so it can be path-filtered: a game-only change cannot break
# any of this, and the VM takes 10-15 minutes.
name: previews

on:
  pull_request:
    paths: &paths
      - "nix/**"
      - "previews/**"
      - "build/**"
      - "flake.nix"
      - "flake.lock"
      - "deps.edn"
      - "deps-lock.json"
      - ".github/workflows/previews.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  vm-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      # read-only here: the werwolf build main pushed is reused, not compiled
      #
      # The one cache this job uses. It also had magic-nix-cache, which none of
      # nine runs checked (main, PRs, Renovate) read a single path from:
      # everything came from cache.nixos.org or Cachix. After the VM test it uploaded each store path the job had added to the
      # GitHub cache one by one, the VM's whole nixpkgs closure among them: 960
      # paths and 20 minutes on a Renovate PR. Those uploads also pushed the
      # repository past GitHub's 10 GB cache limit, evicting what ci.yml's test
      # jobs do read from it.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: werwolf-clj
          skipPush: true

      # Renovate bumps deps.edn but not deps-lock.json, and ci.yml regenerates
      # the lock in a run of its own beside this one. Built from Renovate's own
      # commit, the frontend failed every time on an artifact the offline build
      # did not have ("thheller:shadow-cljs:pom:3.5.8 (absent)"), and the run
      # on the bot's lock commit waits for someone to approve it. So regenerate
      # it here too, for this build only: no commit, no push. nix build reads
      # the working tree, so the VM test builds with it.
      - name: Regenerate deps-lock.json on Renovate branches
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'renovate/')
        run: |
          # The pinned clj-nix, not the latest: a newer one writes a lock
          # format the pinned builder refuses ("Lock file generated with a
          # different clj-nix version").
          nix run --inputs-from . clj-nix#deps-lock -- --alias-exclude dev

      - name: VM test
        run: nix build -L .#checks.x86_64-linux.previews


# Keeps one open "release" PR up to date with every push to main. Merging it
# bumps the version in package.json, writes CHANGELOG.md, tags vX.Y.Z and
# publishes a GitHub release.
#
# The version is computed from Conventional Commit messages since the last
# release: fix -> patch, feat -> minor, and while below 1.0, a breaking change
# (feat!: or BREAKING CHANGE:) is also only a minor bump.
#
# Needs "Allow GitHub Actions to create and approve pull requests" switched on
# under Settings > Actions > General, or the PR is never opened.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    steps:
      # Pinned to a commit, not the moving v4 tag: this step can write to the repo.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
